<!DOCTYPE html>
{% load static %}

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'Css/base.css' %}">

    {% block extra_css %}{% endblock %}

    <!--<link rel="shortcut icon" href="{% static 'Imagens/agenda.png' %}"> -->
    <title>
      {% block title %}
        VoleiON
      {% endblock %}
    </title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="background-color: rgba(0, 0, 0, 0.7) !important;">
      <a class="navbar-brand" href="{% url 'home' %}">VoleiON</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item active">
            <a class="nav-link" href={% url 'editar_usuario' %}>Editar usuario</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href={% url 'registro_jogo' %}>Cadastrar jogo</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href={% url 'tesouraria' %}>Tesouraria</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href={% url 'deletar_usuario' %}>Deletar usuário</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href={% url 'logs' %}>Registros</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href={% url 'Logout' %}>Sair</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container" s = 40px>
      {% block content %}
      {% endblock %}
    </div>
      
       
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/locales/pt-br.global.min.js"></script>
  </body>
</html>

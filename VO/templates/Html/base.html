<!DOCTYPE html>
{% load static %}

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--<link rel="shortcut icon" href="{% static 'Imagens/agenda.png' %}"> -->
    <title>
      {% block title %}
        VoleiON
      {% endblock %}
    </title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="{% url 'home' %}">VoleiON</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item active">
            <a class="nav-link" href={% url 'editar_usuario' %}>editar_usuario</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href={% url 'registro_jogo' %}>Cadastrar jogo</a>
          </li>
        </ul>
      </div>
    </nav>

    <div class="container" s = 40px>
      {% block content %}
        <section class="botoes-principais">
          <div class="botao">
            <a href="{% url 'registro_jogo' %}">
              <img src="{% static 'Images/veado.png' %}" alt="templo grego" title="Eventos inscritos">
            </a>
          </div>
      </section>
      {% endblock %}
    </div>
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.bundle.min.js" ></script>
  </body>
</html>

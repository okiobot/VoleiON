<!DOCTYPE html>
{% load static %}

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'Css/base.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script defer src="{% static 'Java_Script/calendario.js' %}"></script>
    <!--<link rel="shortcut icon" href="{% static 'Imagens/agenda.png' %}"> -->
    <title>
      {% block title %}
        VoleiON
      {% endblock %}
    </title>
  </head>
  <body>
    <nav>
      <div class="navbar">
        <div class="logo"><a href={% url "home"%}>VoleiON</a></div>
        <ul class="menu">
          <li><a href={% url "editar_usuario"%}>Editar Usuario</a></li>
          <li><a href={% url "registro_jogo"%}>Cadastrar Jogo</a></li>
          <li><a href={% url "jogos_disponiveis"%}>Jogos Disponiveis</a></li>
        </ul>
      </div>
    </nav>

    <div class="container" s = 40px>
      {% block content %}

            <!-- Botão -->
        <button onclick="abrirCalendario()">
            Abrir Calendário
        </button>

        <!-- Modal -->
        <div id="modalCalendario" class="modal">

            <div class="modal-content">

                <span class="close" onclick="fecharCalendario()">
                    &times;
                </span>

                <h2>Eventos</h2>

                <!-- Calendário -->
                <div id="calendar"></div>

            </div>
        </div>


        <section class="botoes-principais">
          <div class="botao">
            <a href="{% url 'registro_jogo' %}">
              <img src="{% static 'Images/veado.png' %}" alt="templo grego" title="Eventos inscritos">
            </a>
          </div>
        </section>
      {% endblock %}
    </div>

    {{ eventos_json|json_script:"eventos-data" }}
  </body>
</html>
